<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Read-only lesson player: own scripts and styles only, embedded JPEG data images, and step
         videos only through the window's own capability scheme. No network, frames or objects. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; font-src 'self'; media-src openscreen-lesson-media:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson player</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/lessonPlayer/main.tsx"></script>
  </body>
</html>
